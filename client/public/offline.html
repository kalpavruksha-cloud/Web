<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2f25" />
    <title>Kalpavruksha Portal Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #fbfaf4;
        background: radial-gradient(circle at 20% 0%, rgba(215, 171, 61, 0.28), transparent 24rem), linear-gradient(135deg, #040b1d, #08152f 52%, #0b2f25);
      }
      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 24px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.26);
        backdrop-filter: blur(18px);
      }
      img {
        width: 140px;
        height: auto;
        display: block;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.15;
      }
      p {
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        margin-top: 10px;
        border-radius: 14px;
        padding: 12px 16px;
        background: #d7ab3d;
        color: #08152f;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/app-icon-v2-192x192.png" alt="Kalpavruksha Wealth" />
      <h1>Offline</h1>
      <p>The app shell is available, but live wealth records require an internet connection because Google Spreadsheet remains the only business database.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
